# ───────────────────────── I. Diagnosis (deterministic composites) ─────────────────────────
- id: DX-01
  name: diagnose_table_access
  domain: diagnosis
  phase: 1
  type: derived
  summary: Runs the whole access chain for one user and one table and returns expected-versus-actual access, root cause codes and next actions.
  how: "caa_core.diagnosis engine: layers L0-L5 in docs/06, calling the tools above in parallel. Deterministic; the LLM explains the result, it does not compute it."
  rest: "POST /v1/diagnoses/table-access"
  inputs: {user: string, table: string, platform: "snowflake|databricks|starburst", query_id: "string (optional)"}
  outputs: [verdict, expected_access, actual_access, layers: "[{layer, status, findings}]", root_causes: "[{code, confidence, evidence_refs}]", next_actions]
  freshness: live
  scope: support
- id: DX-02
  name: diagnose_failed_query
  domain: diagnosis
  phase: 1
  type: derived
  summary: Classifies a failed query (access, session context, SQL error, compute, data availability) and, if access-related, runs DX-01 for the tables involved.
  how: "Error-code map config/error-catalog.yaml + SF-06 + sqlglot table extraction + DX-01"
  rest: "POST /v1/diagnoses/failed-query"
  inputs: {query_id: "string (optional)", user: "string (optional)", platform: string}
  outputs: [error_class, tables_involved, session_context, diagnosis, next_actions]
  freshness: "lagged(45m)"
  scope: support
- id: DX-03
  name: diagnose_row_visibility
  domain: diagnosis
  phase: 2
  type: derived
  summary: Explains why a user sees no rows or fewer rows than expected - expected scope versus granted scope.
  how: "EN-01 + expected value(s) supplied by the user + ID-06/SF-13 for recent changes"
  rest: "POST /v1/diagnoses/row-visibility"
  inputs: {user: string, table: string, expected_values: "string[] (optional, e.g. account ids)"}
  outputs: [verdict, visible_values, missing_values, cause, next_actions]
  freshness: live
  scope: support
- id: DX-04
  name: diagnose_masked_columns
  domain: diagnosis
  phase: 2
  type: derived
  summary: Explains why specific columns are masked or NULL for a user and what entitlement would unmask them.
  how: "EN-02 scoped to the named columns + IM-09 exceptions"
  rest: "POST /v1/diagnoses/masked-columns"
  inputs: {user: string, table: string, columns: "string[] (optional)"}
  outputs: [verdict, columns: "[{column, state, reason, unmask_requires}]", next_actions]
  freshness: live
  scope: support
- id: DX-05
  name: diagnose_login_failure
  domain: diagnosis
  phase: 2
  type: derived
  summary: Explains why a user cannot connect - disabled account, locked, network policy, expired credential, SSO or key-pair problem.
  how: "ID-02 + SF-01 + SF-09 (+ SF-14) against config/error-catalog.yaml"
  rest: "POST /v1/diagnoses/login-failure"
  inputs: {user: string, platform: string}
  outputs: [verdict, cause, next_actions]
  freshness: "lagged(2h)"
  scope: support

